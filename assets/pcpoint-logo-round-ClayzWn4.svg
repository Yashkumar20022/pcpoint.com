<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="PC-Point Computer Education" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#f97316"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e2a8f"/>
      <stop offset="1" stop-color="#1a175c"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1e1b6e" flood-opacity=".35"/>
    </filter>
    <!-- top arc (left to right over the top) -->
    <path id="top" d="M 46,150 A 104,104 0 0 1 254,150"/>
    <!-- bottom arc (left to right under the bottom) -->
    <path id="bot" d="M 31,150 A 119,119 0 0 0 269,150"/>
  </defs>

  <!-- Outer rings -->
  <g filter="url(#sh)">
    <circle cx="150" cy="150" r="146" fill="url(#ring)"/>
    <circle cx="150" cy="150" r="138" fill="url(#navy)"/>
  </g>
  <circle cx="150" cy="150" r="90" fill="none" stroke="url(#ring)" stroke-width="3" opacity=".9"/>

  <!-- Circular text -->
  <text font-family="'Baloo 2','Poppins','Segoe UI',Arial,sans-serif" font-size="31" font-weight="800" letter-spacing="3" fill="#fff" text-anchor="middle">
    <textPath href="#top" startOffset="50%">PC-POINT</textPath>
  </text>
  <text font-family="'Poppins','Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3.2" fill="#fbbf24" text-anchor="middle">
    <textPath href="#bot" startOffset="50%">COMPUTER EDUCATION</textPath>
  </text>

  <!-- Separator stars -->
  <circle cx="38" cy="150" r="4" fill="#fb923c"/>
  <circle cx="262" cy="150" r="4" fill="#fb923c"/>

  <!-- Centre disc -->
  <circle cx="150" cy="150" r="84" fill="#fff"/>
  <circle cx="150" cy="150" r="84" fill="none" stroke="url(#ring)" stroke-width="5"/>

  <!-- Icon: cap + monitor -->
  <g transform="translate(150 150) scale(1.4) translate(-50 -46)">
    <polygon points="50,15 76,26 50,37 24,26" fill="#f97316"/>
    <path d="M35 31v8q15 7 30 0v-8l-15 6z" fill="#dc2626"/>
    <line x1="76" y1="26" x2="76" y2="38" stroke="#f97316" stroke-width="2"/>
    <circle cx="76" cy="40" r="2.8" fill="#fbbf24"/>

    <rect x="31" y="44" width="38" height="25" rx="4" fill="#1e1b6e" stroke="#1e1b6e" stroke-width="3"/>
    <path d="M39 51l6 5-6 5" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="49" y1="61" x2="60" y2="61" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
    <path d="M50 69v5M42 75h16" stroke="#1e1b6e" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
